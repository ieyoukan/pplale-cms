{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{/*
  平文の values から Secret を作る経路。ローカル検証用。
  本番では secrets.existingSecret に sealed-secrets / external-secrets が
  作った Secret 名を指定すること。
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pplale-cms.fullname" . }}
  labels:
    {{- include "pplale-cms.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
