apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pplale-cms.fullname" . }}
  labels:
    {{- include "pplale-cms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pplale-cms.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pplale-cms.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ toYaml .Values.secrets | sha256sum }}
    spec:
      serviceAccountName: {{ include "pplale-cms.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADDR
              value: ":8080"
            - name: BASE_URL
              value: {{ .Values.baseURL | quote }}
            - name: GITHUB_OWNER
              value: {{ .Values.upstream.owner | quote }}
            - name: GITHUB_REPO
              value: {{ .Values.upstream.repo | quote }}
            - name: GITHUB_BASE_BRANCH
              value: {{ .Values.upstream.baseBranch | quote }}
            - name: SESSION_TTL
              value: {{ .Values.session.ttl | quote }}
            - name: SUBMIT_LIMIT_PER_HOUR
              value: {{ .Values.session.submitLimitPerHour | quote }}
            {{- with .Values.bootstrapAdmin.discordId }}
            - name: BOOTSTRAP_ADMIN_DISCORD_ID
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: password
            # Kubernetes expands $(VAR_NAME) only when VAR_NAME appears earlier
            # in this env list. Keep PGPASSWORD before DATABASE_URL.
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:$(PGPASSWORD)@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "pplale-cms.secretName" . }}
                  key: DATABASE_URL
            {{- end }}
            {{- range $key := list "DISCORD_CLIENT_ID" "DISCORD_CLIENT_SECRET" "SESSION_KEY" "GITHUB_APP_ID" "GITHUB_APP_INSTALLATION_ID" "GITHUB_APP_PRIVATE_KEY" "GITHUB_WEBHOOK_SECRET" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "pplale-cms.secretName" $ }}
                  key: {{ $key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # 画像アップロードの一時ファイル置き場。ルートFSは読み取り専用にしている。
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
